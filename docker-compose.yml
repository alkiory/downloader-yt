services:
  youtube-downloader:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-audio-downloader
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - MAX_PLAYLIST_SIZE=50
      - MAX_DOWNLOADS_PER_HOUR=10
      - MAX_DOWNLOADS_PER_DAY=50
      - MAX_FILE_SIZE_MB=250
      - MAX_CONCURRENT_DOWNLOADS=3
      - DOWNLOAD_TIMEOUT=300
      - DOWNLOAD_LIVESTREAM_FROM_START=true
      - PORT=5000
      - BITRATE=192
      - DOWNLOAD_DIR=/app/downloads
      - USE_X_FORWARDED_FOR=false
      # Rate limiting stays OFF for local Docker (the app defaults to false).
      # Only online deployments enable it, e.g. render.yaml sets it to true.
      # - RATE_LIMIT_ENABLED=true
      # - DEFAULT_RATE_LIMIT=60 per minute, 3600 per hour
      # Optional: get past YouTube's bot check on datacenter IPs.
      # - COOKIE_FILE=/cookies/cookies.txt
      # - YOUTUBE_COOKIES_B64=base64-encoded-Netscape-cookies
      # - YOUTUBE_COOKIE_BEHAVIOR=when_needed
      # - YOUTUBE_USER_AGENT=Mozilla/5.0 ...
      # - YOUTUBE_PROXY=http://user:pass@residential-proxy:port
      # - YOUTUBE_PLAYER_CLIENTS=android,ios,tv
    volumes:
      - downloads:/app/downloads
      # - ./cookies:/cookies:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - downloader-network

networks:
  downloader-network:
    driver: bridge

volumes:
  downloads: