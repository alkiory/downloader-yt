name: Security & Docker Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install bandit safety pip-audit

      - name: Run Bandit Security Scanner
        continue-on-error: true
        run: |
          cd backend
          bandit -r . -c pyproject.toml -f json -o bandit-results.json || true
          bandit -r . -c pyproject.toml -f txt

      - name: Check for HIGH severity findings
        run: |
          cd backend
          if [ -f bandit-results.json ]; then
          python3 - <<'PYEOF'
          import json
          import sys

          with open('bandit-results.json') as f:
              results = json.load(f)

          high_severity = [r for r in results.get('results', []) if r.get('issue_severity') == 'HIGH']

          if high_severity:
              print(f'Found {len(high_severity)} HIGH severity issues')
              for issue in high_severity:
                  print(f'  - {issue.get("test_name")}: {issue.get("issue_text")}')
              sys.exit(1)
          else:
              print('No HIGH severity issues found')
          PYEOF
          fi

      - name: Check dependencies for vulnerabilities
        continue-on-error: true
        run: |
          cd backend
          safety check || true
          pip-audit || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: backend/bandit-results.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          cd backend
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/youtube-audio-downloader:latest
            ${{ secrets.DOCKER_USERNAME }}/youtube-audio-downloader:${{ github.sha }}

      - name: Run container security scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/youtube-audio-downloader:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          version: 'v0.69.3'