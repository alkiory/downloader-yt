name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 2 * * 0" # Every Sunday at 2 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  full-security-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          cd backend
          pip install bandit safety pip-audit semgrep

      - name: Run Bandit
        run: |
          cd backend
          bandit -r . -f json -o bandit-full.json || true
          bandit -r . -f txt

      - name: Run Semgrep
        run: |
          cd backend
          semgrep --config=auto --json -o semgrep-results.json || true

      - name: Check dependencies
        run: |
          cd backend
          safety check --full-report || true
          pip-audit --format=json -o pip-audit-results.json || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: full-security-scan
          path: |
            backend/bandit-full.json
            backend/semgrep-results.json
            backend/pip-audit-results.json

      - name: Create Security Issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Security vulnerabilities found',
                body: 'The scheduled security scan found vulnerabilities. Please check the workflow run for details.',
                labels: ['security', 'needs-triage']
              });
            }
